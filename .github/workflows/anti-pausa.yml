name: Anti-pausa Supabase

# El plan gratis de Supabase pausa el proyecto tras ~1 semana sin actividad.
# Este workflow hace una consulta liviana (resolver_qr con un código inexistente)
# cada ~3 días para mantenerlo activo.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a resolver_qr
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          resp=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/resolver_qr" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_codigo":"PINGTEST"}')
          echo "Respuesta: $resp"
          echo "$resp" | grep -q '"estado"'
